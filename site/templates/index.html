<!DOCTYPE html>
<html lang="ko">
<head>

<link rel="stylesheet" href="site.css">
</head>
<body>
<div class="wrap">

  {{GROUPS}}

  <footer>
    <span>원문 <a href="docs.html">문서 뷰</a> · <a href="https://github.com/{{REPO}}" target="_blank" rel="noopener">GitHub</a></span>
    <span>초기 현금은 실거주 · 무주택 · DSR 미반영. 분양가 · 권리가액은 감정평가 전 추정치. 안전마진은 확정 수익이 아니다.</span>
  </footer>
</div>

</html>
