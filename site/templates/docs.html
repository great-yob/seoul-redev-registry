<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문서 뷰 · 서울 재개발 구역 레지스트리</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280; --border: #e5e7eb; --accent: #2563eb; --code-bg: #f3f4f6; --tab-bg: #f9fafb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161a; --fg: #e5e7eb; --muted: #9ca3af; --border: #2c2f36; --accent: #60a5fa; --code-bg: #1e2126; --tab-bg: #1a1d22; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; line-height: 1.6; }
  header { padding: 20px 16px 0; max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.25rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 0.82rem; margin-bottom: 12px; }
  .subtitle a { color: var(--accent); }
  nav.tabs { display: flex; gap: 4px; max-width: 900px; margin: 0 auto; padding: 0 16px; border-bottom: 1px solid var(--border); overflow-x: auto; }
  nav.tabs button { background: var(--tab-bg); border: 1px solid var(--border); border-bottom: none; color: var(--fg); padding: 10px 14px; font-size: 0.85rem; cursor: pointer; border-radius: 8px 8px 0 0; white-space: nowrap; margin-bottom: -1px; min-height: 40px; }
  nav.tabs button.active { background: var(--bg); border-bottom: 1px solid var(--bg); color: var(--accent); font-weight: 600; }
  main { max-width: 900px; margin: 0 auto; padding: 20px 16px 80px; }
  .doc { display: none; }
  .doc.active { display: block; }
  .doc-meta { color: var(--muted); font-size: 0.8rem; margin-bottom: 16px; word-break: break-all; }
  .doc-meta a { color: var(--accent); }
  .content { font-size: 0.92rem; word-break: keep-all; }
  .content:target { scroll-margin-top: 12px; }
  .content h1, .content h2, .content h3 { border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .content h1 { font-size: 1.3rem; margin-top: 2.2em; }
  .content table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; font-size: 0.85rem; }
  .content th, .content td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .content th { background: var(--code-bg); }
  .content code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 0.88em; }
  .content pre { background: var(--code-bg); padding: 12px; border-radius: 8px; overflow-x: auto; }
  .content pre code { background: none; padding: 0; }
  .content blockquote { border-left: 3px solid var(--accent); margin: 0; padding: 2px 14px; color: var(--muted); }
  .error { color: #dc2626; padding: 20px 0; }
</style>
</head>
<body>
<header>
  <h1>문서 뷰</h1>
  <div class="subtitle"><a href="index.html">← 메인</a> · 원문 그대로 · {{VERSION}} · {{UPDATED}} · 빌드 {{BUILT}}</div>
</header>

<nav class="tabs" id="tabs">{{TABS}}</nav>

<main id="main">{{PANELS}}</main>

{{MD_BLOCKS}}

<script>
(function () {
  var rendered = {};
  function render(el) {
    var id = el.dataset.md;
    if (rendered[id]) return;
    var src = document.getElementById(id);
    if (!src) { el.innerHTML = '<div class="error">' + id + ' 원문 없음</div>'; return; }
    try {
      el.innerHTML = window.marked ? marked.parse(src.textContent, { gfm: true, breaks: false }) : '<pre>' + src.textContent.replace(/</g, '&lt;') + '</pre>';
    } catch (e) { el.innerHTML = '<div class="error">렌더 실패: ' + e.message + '</div>'; }
    rendered[id] = true;
  }
  function activate(id, anchor) {
    document.querySelectorAll('.doc').forEach(function (el) { el.classList.toggle('active', el.id === 'panel-' + id); });
    document.querySelectorAll('nav.tabs button').forEach(function (b) { b.classList.toggle('active', b.dataset.id === id); });
    document.querySelectorAll('#panel-' + id + ' [data-md]').forEach(render);
    if (history.replaceState) history.replaceState(null, '', '#' + (anchor || id));
    if (anchor) { var t = document.getElementById(anchor); if (t) t.scrollIntoView(); }
  }
  var ids = Array.prototype.map.call(document.querySelectorAll('nav.tabs button'), function (b) { return b.dataset.id; });
  document.querySelectorAll('nav.tabs button').forEach(function (b) { b.addEventListener('click', function () { activate(b.dataset.id); }); });
  var h = (location.hash || '').replace('#', '');
  if (/^r\d{2}$/.test(h)) activate('regions', h);
  else activate(ids.indexOf(h) >= 0 ? h : ids[0]);
})();
</script>
</body>
</html>
