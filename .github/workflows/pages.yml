name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "00_PROJECT_BRIEF.md"
      - "10_REGION_REGISTRY.md"
      - "20_POLICY_CHECKLIST_SOURCES.md"
      - "DECISIONS.md"
      - "regions/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (전체 이력 — 구역별 갱신일을 git log로 찍는다)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site (md → _site/)
        run: node site/build.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
