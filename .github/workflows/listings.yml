name: Collect listings (weekly)

# 매주 금요일 04:00 KST = 목요일 19:00 UTC. GitHub 예약 실행은 부하에 따라 수 분~수십 분 늦을 수 있다.
# 로컬 PC와 무관하게 GitHub 러너에서 돈다. 수동 실행: Actions 탭 → Run workflow, 또는 `gh workflow run listings.yml`.
on:
  schedule:
    - cron: "0 19 * * 4"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: listings
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 평소 4~5분. 재개발닷컴 일시 오류는 스크립트가 재시도·쿨다운으로 흡수한다(최악 +15분 안팎) — 그 이상 걸리면 끊는다
    timeout-minutes: 40
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Collect (재개발닷컴 → regions/listings/*.md 통째 쓰기 + data/listings 회차 스냅샷)
        run: python tools/collect_listings.py --summary /tmp/summary.md

      # 규칙 비교시세(00 §3) — 매물과 별개라 실패해도 매물 커밋을 막지 않는다. 키(secrets)가 없으면 exit 2 로 건너뛴다.
      # 국토부 호출이 하나라도 실패하면 .partial.jsonl 로 떨어져(gitignore) 커밋되지 않는다
      - name: Compare (국토부 실거래 → data/compare 규칙 비교시세 회차 스냅샷)
        env:
          MOLIT_API_KEY_DECODED: ${{ secrets.MOLIT_API_KEY_DECODED }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
        run: |
          set +e
          python tools/compare_price.py --summary /tmp/compare.md
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then { echo; cat /tmp/compare.md; } >> /tmp/summary.md
          elif [ $rc -eq 2 ]; then echo "국토부 키(secrets.MOLIT_API_KEY_DECODED) 없음 — 규칙 비교시세 건너뜀"
          else echo "::warning::규칙 비교시세 부분 회차(rc=$rc) — .partial 은 커밋되지 않는다"; fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build check (파서 규약이 깨지면 여기서 실패 — 커밋 안 함)
        run: node site/build.mjs

      - name: Commit, push, deploy pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # data/ 는 신규 파일이라 git diff 에 안 잡힌다 — 미추적까지 보는 git status 로 판정
          # 매물은 regions/listings/ 아래이고 구역 파일은 이 워크플로가 건드리지 않는다
          if [ -z "$(git status --porcelain -- regions data)" ]; then
            echo "매물 파일·회차 스냅샷 모두 변화 없음 — 커밋하지 않는다"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add regions data
          git commit -F /tmp/summary.md
          git push origin HEAD:main
          # GITHUB_TOKEN 으로 push 한 커밋은 다른 워크플로를 자동으로 깨우지 않는다 → Pages 배포를 직접 호출
          gh workflow run pages.yml --ref main
