name: Collect listings (weekly)

# 매주 금요일 04:00 KST = 목요일 19:00 UTC. GitHub 예약 실행은 부하에 따라 수 분~수십 분 늦을 수 있다.
# 로컬 PC와 무관하게 GitHub 러너에서 돈다. 수동 실행: Actions 탭 → Run workflow, 또는 `gh workflow run listings.yml`.
on:
  schedule:
    - cron: "0 19 * * 4"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: listings
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Collect (재개발닷컴 → regions/*.md ## 매물 절 교체 + data/listings 회차 스냅샷)
        run: python tools/collect_listings.py --summary /tmp/summary.md

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build check (파서 규약이 깨지면 여기서 실패 — 커밋 안 함)
        run: node site/build.mjs

      - name: Commit, push, deploy pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # data/ 는 신규 파일이라 git diff 에 안 잡힌다 — 미추적까지 보는 git status 로 판정
          if git diff --quiet -- regions && [ -z "$(git status --porcelain -- data)" ]; then
            echo "매물 절·회차 스냅샷 모두 변화 없음 — 커밋하지 않는다"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add regions data
          git commit -F /tmp/summary.md
          git push origin HEAD:main
          # GITHUB_TOKEN 으로 push 한 커밋은 다른 워크플로를 자동으로 깨우지 않는다 → Pages 배포를 직접 호출
          gh workflow run pages.yml --ref main
